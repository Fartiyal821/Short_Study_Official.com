<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortStudy — Redirecting</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
    // GitHub Pages SPA router fallback
    (function() {
      var path = window.location.pathname;
      // If user typed /admin or /admin/
      if (path.endsWith('/admin') || path.endsWith('/admin/')) {
        var repoBase = path.replace(/\/admin\/?$/, '');
        window.location.replace((repoBase || '') + '/admin.html' + window.location.search + window.location.hash);
        return;
      }
      // If user typed a page without .html extension
      if (!path.endsWith('.html') && !path.endsWith('/')) {
        window.location.replace(path + '.html' + window.location.search + window.location.hash);
        return;
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center;">
  <div style="padding: 28px; max-width: 440px; background: #131b2e; border: 1px solid #1e293b; border-radius: 12px;">
    <h2 style="font-size: 20px; font-weight: 600; margin-top: 0; margin-bottom: 8px;">ShortStudy</h2>
    <p style="color: #94a3b8; font-size: 14px; margin-bottom: 18px;">Redirecting you to the requested page...</p>
    <div style="display: flex; justify-content: center; gap: 14px;">
      <a href="admin.html" style="color: #6366f1; text-decoration: underline; font-size: 14px;">Admin Portal</a>
      <a href="index.html" style="color: #94a3b8; text-decoration: underline; font-size: 14px;">Home Page</a>
    </div>
  </div>
</body>
</html>
