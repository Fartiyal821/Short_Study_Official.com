<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin workspace — ShortStudy</title><meta name="description" content="Protected ShortStudy course administration workspace."><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><a class="brand" href="index.html">Short<span>Study</span></a><a class="nav-admin-link" href="index.html">Back to site</a></div></header><main class="admin-page"><section id="loginView" class="admin-card"><span class="kicker">Protected workspace</span><h1>Sign in to edit courses</h1><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="cta-btn" type="submit">Sign in</button><p id="loginMessage" class="form-message" role="status"></p></form></section><section id="workspace" class="admin-workspace" hidden><div class="admin-toolbar"><div><span class="kicker">ShortStudy CMS</span><h1>Course workspace</h1></div><button id="logoutButton" class="button-secondary">Log out</button></div><div class="admin-grid"><form id="courseForm" class="admin-card"><h2>Create or update course</h2><input type="hidden" id="courseDocId"><label>Course title<input id="courseTitle" required></label><label>Unique slug<input id="courseId" required pattern="[a-z0-9-]+"></label><label>Category<input id="courseCategory" required></label><label>Thumbnail URL<input id="thumbnailUrl" type="url"></label><label>Description<textarea id="courseDescription" required></textarea></label><label>Status<select id="courseStatus"><option value="in_development">In development</option><option value="published">Published</option></select></label><button class="cta-btn" type="submit">Save course</button><p id="courseMessage" class="form-message" role="status"></p></form><div class="admin-card"><h2>Courses</h2><select id="courseSelect"><option value="">Select a course</option></select><div id="courseList" class="admin-list"></div></div><form id="postForm" class="admin-card admin-post-form"><h2>Add lesson post</h2><label>Post title<input id="postTitle" required></label><label>YouTube embed iframe<textarea id="videoIframe" placeholder="Paste a YouTube iframe"></textarea></label><label>HTML content<textarea id="postContent" required placeholder="Use semantic HTML: headings, paragraphs, lists, pre/code, and callouts."></textarea></label><label>Author<input id="postAuthor" value="ShortStudy" required></label><button class="cta-btn" type="submit">Publish &amp; make live</button><p id="postMessage" class="form-message" role="status"></p></form></div></section></main><script type="module" src="admin.js"></script></body></html>
